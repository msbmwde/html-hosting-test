<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GitHub Pages Test</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
        font: 1.125rem/1.6 system-ui, sans-serif;
      }
      main {
        max-width: 36rem;
        padding: 2rem;
      }
      h1 { color: #86efac; }
      button {
        padding: .75rem 1rem;
        border: 0;
        border-radius: .5rem;
        background: #86efac;
        color: #0f172a;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Your test page is working.</h1>
      <p>If you're viewing this at your GitHub Pages URL, public hosting works.</p>
      <button id="test" type="button">Test JavaScript</button>
      <p id="result" role="status">Ready for a click.</p>
    </main>
    <script>
      document.getElementById("test").addEventListener("click", () => {
        document.getElementById("result").textContent =
          "JavaScript works! Test completed at " + new Date().toLocaleTimeString();
      });
    </script>
  </body>
</html>
